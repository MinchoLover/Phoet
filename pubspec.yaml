name: poet
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.1

  #상태관리
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  #ML Kit
  camera: ^0.11.2
  google_mlkit_image_labeling: ^0.14.1
  google_mlkit_commons: ^0.11.0

  #Firebase
  firebase_core: ^4.2.1
  firebase_ai: ^3.4.0

  cupertino_icons: ^1.0.8

  #local storage
  shared_preferences: ^2.2.3

  #날짜/시간
  intl: ^0.20.2

  #공유 기능
  share_plus: ^12.0.1

  # JSON 자동 직렬화
  json_annotation: ^4.9.0

  # 위치 정보
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.1.0
  firebase_auth: ^6.1.2

dev_dependencies:

  build_runner: ^2.7.1
  riverpod_generator: ^3.0.3
  json_serializable: ^6.8.0

  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true
  

